services:
  # Servicio Web (PHP/Apache)
  - type: web
    name: biblioteca-web
    env: docker
    plan: free
    region: oregon 
    buildCommand: docker build -t biblioteca-web .
    startCommand: apache2-foreground
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_PORT
        value: "5432"
